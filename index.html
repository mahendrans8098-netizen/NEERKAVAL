<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeerKaval — Flood Intelligence & Emergency Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A;--navy2:#132F57;--navy3:#1D4479;
  --bg:#EDF0F4;--surface:#FFFFFF;--soft:#F4F6F9;--ink:#0F1F38;--muted:#4A5A73;--line:#CDD5E1;
  --green:#17803F;--yellow:#F2C200;--orange:#D45F00;--red:#D32020;--dred:#7C0A14;--blue:#1A63C7;
  --green-t:#E2F3E8;--yellow-t:#FFF5C7;--orange-t:#FFEAD3;--red-t:#FCE1E1;--dred-t:#F2D3D7;--blue-t:#E0ECFA;
  --focus:#1A63C7;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fd:'Barlow Condensed','Barlow',system-ui,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F;--surface:#0F1D33;--soft:#132441;--ink:#E7EDF7;--muted:#9DB0CB;--line:#26406A;
  --green:#4CC57D;--yellow:#F5CD2E;--orange:#FF9A3D;--red:#FF6060;--dred:#FF7C88;--blue:#6AAEFF;
  --green-t:#123222;--yellow-t:#3A3208;--orange-t:#3D2408;--red-t:#421515;--dred-t:#40131A;--blue-t:#122A4D;--focus:#8DC2FF;}}
:root[data-theme="dark"]{
  --bg:#08111F;--surface:#0F1D33;--soft:#132441;--ink:#E7EDF7;--muted:#9DB0CB;--line:#26406A;
  --green:#4CC57D;--yellow:#F5CD2E;--orange:#FF9A3D;--red:#FF6060;--dred:#FF7C88;--blue:#6AAEFF;
  --green-t:#123222;--yellow-t:#3A3208;--orange-t:#3D2408;--red-t:#421515;--dred-t:#40131A;--blue-t:#122A4D;--focus:#8DC2FF;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}
html.large{font-size:18.5px}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4;-webkit-font-smoothing:antialiased}
:lang(ta),.ta{font-family:'Noto Sans Tamil',var(--font)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:.6rem 1rem;z-index:999}
.skip:focus{left:8px;top:8px}
.ic{flex:none;vertical-align:middle}
#app{min-height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* risk classes */
.lv-safe{--x:var(--green);--xt:var(--green-t);--xc:#fff}
.lv-watch{--x:var(--yellow);--xt:var(--yellow-t);--xc:#1a1a1a}
.lv-warn{--x:var(--orange);--xt:var(--orange-t);--xc:#fff}
.lv-high{--x:var(--red);--xt:var(--red-t);--xc:#fff}
.lv-crit{--x:var(--dred);--xt:var(--dred-t);--xc:#fff}
:root[data-theme="dark"] .lv-crit,:root:not([data-theme="light"]) .lv-crit{--xc:#1a0508}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .lv-crit{--xc:#fff}}
.rb{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .55rem .15rem .4rem;border:2px solid var(--x);border-radius:4px;background:var(--xt);color:var(--x);font-weight:700;font-size:.85rem;white-space:nowrap}
:root[data-theme="light"] .lv-watch .rb,.lv-watch.rb{color:#6b5500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv-watch.rb{color:var(--yellow)}}
:root[data-theme="dark"] .lv-watch.rb{color:var(--yellow)}
.rb .n{font-family:var(--fd);font-size:1.05em;font-weight:700}
.rb.solid{background:var(--x);color:var(--xc)}
.rb.lg{font-size:1.15rem;padding:.3rem .8rem .3rem .6rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:40px;padding:.45rem .95rem;border:2px solid var(--navy3);background:var(--surface);color:var(--navy3);border-radius:5px;font-weight:600;text-decoration:none}
:root[data-theme="dark"] .btn{color:var(--ink);border-color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:var(--ink);border-color:var(--blue)}}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy3);color:#fff;border-color:var(--navy3)}
.btn.pri:hover{background:var(--navy2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1a0505}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#1a0505}}
.btn.danger:hover{filter:brightness(.92)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.sm{min-height:32px;padding:.2rem .6rem;font-size:.88rem}
.btn.xl{min-height:60px;font-size:1.15rem;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.why{border-color:var(--blue);color:var(--blue);background:var(--blue-t);min-height:32px;padding:.15rem .6rem;font-size:.9rem}

/* layout */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#DCE6F5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:.6rem;padding:1rem 1rem .9rem;color:#fff}
.logo svg{width:32px;height:32px}
.logo b{font-family:var(--fd);font-size:1.5rem;letter-spacing:.06em;line-height:1}
.logo small{display:block;font-size:.8rem;opacity:.8;font-family:'Noto Sans Tamil',var(--font)}
.nav{display:flex;flex-direction:column;padding:.3rem .5rem;gap:2px}
.nav button{display:flex;align-items:center;gap:.7rem;background:none;border:0;color:inherit;text-align:left;padding:.62rem .7rem;border-radius:4px;border-left:4px solid transparent;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);border-left-color:#fff;color:#fff;font-weight:700}
.nav .sep{height:1px;background:rgba(255,255,255,.15);margin:.5rem .4rem}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:.75rem;padding:0 .4rem;border-radius:9px;font-weight:700}
.side .foot{margin-top:auto;padding:.8rem 1rem;font-size:.75rem;opacity:.7}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:.7rem;padding:.55rem 1rem;padding-top:calc(.55rem + env(safe-area-inset-top,0px));min-height:58px}
.top .search{position:relative;flex:1;max-width:340px}
.top .search input{width:100%;height:38px;padding:0 .7rem 0 2.2rem;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:inherit}
.top .search input::placeholder{color:#C3D1E8}
.top .search svg{position:absolute;left:.65rem;top:9px;color:#C3D1E8}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:5px;padding:.3rem .6rem;font-weight:600;font-size:.88rem;min-height:36px}
.pill.on .dot{background:#5BE28A}.pill.off{background:#7C0A14;border-color:#FF9AA3}.pill.off .dot{background:#FF9AA3}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.clock{font-family:var(--fd);font-size:1.25rem;font-weight:600;letter-spacing:.03em;line-height:1}
.clock small{display:block;font-family:var(--font);font-size:.62rem;font-weight:500;opacity:.8;letter-spacing:.02em}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:5px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:.3rem .6rem;font-weight:600;min-height:34px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.iconbtn{position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:.7rem;font-weight:700;border-radius:9px;padding:0 .35rem;min-width:18px;text-align:center}
.prof{display:flex;align-items:center;gap:.5rem;font-size:.85rem;line-height:1.15}
.prof .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700}
.prof small{opacity:.8;display:block}
#menuBtn{display:none}
main{padding:1rem 1.1rem 6rem;max-width:1500px;width:100%;margin:0 auto;outline:0}
.pgh{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.pgh h1{font-family:var(--fd);font-size:2rem;font-weight:700;line-height:1;letter-spacing:.01em}
.pgh p{color:var(--muted);margin-top:.2rem}
.pgh .r{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.card>header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>header h2,.card>header h3{font-size:1rem;font-weight:700}
.card>header .r{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.card .body{padding:.9rem}
.grid{display:grid;gap:.9rem}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr)}
.split2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mt{margin-top:.9rem}
.muted{color:var(--muted)}.small{font-size:.86rem}.b{font-weight:700}
.tamil{font-family:'Noto Sans Tamil',var(--font);font-weight:600}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}

/* banners */
.bn{display:flex;align-items:center;gap:.7rem;padding:.6rem 1.1rem;flex-wrap:wrap;border-bottom:2px solid var(--x,var(--line));background:var(--xt,var(--soft));font-weight:600}
.bn .r{margin-left:auto;display:flex;gap:.4rem}
.bn.solid{background:var(--x);color:var(--xc);border-color:var(--x)}
.bn.solid .btn{background:#fff;color:#111;border-color:#fff}
.bn.info{--x:var(--blue);--xt:var(--blue-t)}
.bn.info{color:var(--ink)}

/* KPI */
.kpi{padding:.85rem 1rem;border-left:6px solid var(--x,var(--navy3))}
.kpi .l{font-weight:600;color:var(--muted);font-size:.9rem;display:flex;gap:.4rem;align-items:center}
.kpi .v{font-family:var(--fd);font-size:3rem;font-weight:700;line-height:1;margin:.3rem 0 .15rem}
.kpi .s{font-size:.85rem;color:var(--muted)}
.kpi.lv-safe,.kpi.lv-high,.kpi.lv-crit,.kpi.lv-warn{}
.kpi.blue{--x:var(--blue)}

/* map */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#dfe6d3}
svg.map{display:block;width:100%;height:auto;aspect-ratio:1000/620;touch-action:manipulation}
.map text{font-family:'Barlow',system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;fill:#0B1F3A;pointer-events:none}
.map .wl{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;font-size:17px}
.map .ws{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;font-size:15px}
.map .ml{font-size:11.5px;font-weight:700}
.map .tl{font-size:13px;font-style:italic;fill:#1d5fa8}
.map g[data-act]{cursor:pointer}
.map g.wd:hover path:first-child{fill-opacity:.7}
.map g.wd:focus-visible{outline:none}
.map g.wd:focus-visible path:first-child{stroke:#1A63C7;stroke-width:5}
.map .flood{animation:fl 3s ease-in-out infinite alternate}
@keyframes fl{from{stroke-opacity:.2}to{stroke-opacity:.38}}
.map .pulse circle:first-child,.map .pulse polygon{animation:pl 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{50%{transform:scale(1.12)}}
.map .flow{stroke-dasharray:14 10;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.map .ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:36px;height:36px;border:1px solid #8a94a3;background:#fff;color:#0B1F3A;border-radius:4px;font-weight:700;display:grid;place-items:center}
.livechip{position:absolute;left:8px;top:8px;background:var(--navy);color:#fff;border-radius:4px;padding:.25rem .55rem;font-size:.82rem;font-weight:600;display:flex;gap:.45rem;align-items:center}
.livechip .dot{background:#5BE28A;animation:blink 1.6s infinite}
.livechip.stale .dot{background:#FF9AA3;animation:none}
@keyframes blink{50%{opacity:.35}}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;padding:.6rem .2rem 0;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend svg{border:1px solid #6b7280}
.layers{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.88rem}
.layers label{display:inline-flex;gap:.35rem;align-items:center;cursor:pointer}
.layers input{width:18px;height:18px}
.seg{display:inline-flex;border:2px solid var(--navy3);border-radius:5px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:.3rem .8rem;font-weight:600;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--navy3);color:#fff}

/* lists/tables */
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wlist li:last-child{border-bottom:0}
.wlist li[aria-current="true"]{background:var(--soft)}
.wlist .nm{font-weight:700;min-width:5.6rem}
.wlist .lc{color:var(--muted);font-size:.85rem;flex:1;min-width:6rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-size:.8rem;color:var(--muted);padding:.4rem .6rem;border-bottom:2px solid var(--line);font-weight:600}
table.t td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.sel td{background:var(--soft)}
.scroll{overflow-x:auto}

/* 4W */
.fourw{display:grid;gap:0}
.fourw .row{display:grid;grid-template-columns:5.5rem 1fr;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--line)}
.fourw .row:last-child{border-bottom:0}
.fourw dt{font-family:var(--fd);font-size:1.25rem;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;gap:.4rem;color:var(--navy3)}
:root[data-theme="dark"] .fourw dt{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fourw dt{color:var(--blue)}}
.fourw dd{margin:0}
.fourw .ta{display:block;font-size:.85rem;color:var(--muted)}

/* chips */
.chip{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:.08rem .4rem;border-radius:3px;border:1.5px solid;white-space:nowrap;vertical-align:middle}
.c-measured{background:var(--navy3);color:#fff;border-color:var(--navy3)}
.c-forecast{background:transparent;color:var(--blue);border-color:var(--blue);border-style:dashed}
.c-ai{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.c-xai{background:var(--soft);color:var(--ink);border-color:var(--muted)}
.c-terrain{background:var(--soft);color:var(--muted);border-color:var(--line)}
.c-est{background:var(--blue-t);color:var(--blue);border-color:var(--blue)}

/* XAI */
.xai-h{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.5rem}
.xai-h h3{font-family:var(--fd);font-size:1.6rem;font-weight:700;line-height:1.05}
.fac{border:1px solid var(--line);border-radius:5px;margin-bottom:.5rem;background:var(--surface)}
.fac>button{width:100%;display:grid;grid-template-columns:1.2rem minmax(0,1fr) auto;gap:.3rem .7rem;align-items:center;background:none;border:0;padding:.65rem .8rem;text-align:left}
.fac .fn{font-weight:700;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.fac .fv{font-family:var(--fd);font-size:1.8rem;font-weight:700;line-height:1}
.fac .blocks{grid-column:2/4;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.fac .blocks i{height:14px;background:var(--line);border-radius:1px}
.fac .blocks i.f{background:var(--x)}
.fac .chev{transition:transform .2s}
.fac>button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fac .det{padding:.2rem .8rem .8rem 2.2rem;border-top:1px dashed var(--line);display:none}
.fac>button[aria-expanded="true"]+.det{display:block}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin:.5rem 0}
.det dt{color:var(--muted)}.det dd{margin:0;font-weight:700}
.det q{display:block;font-style:normal;border-left:4px solid var(--blue);padding:.2rem .7rem;background:var(--blue-t)}
.tag{font-size:.72rem;font-weight:700;border:1.5px solid var(--muted);border-radius:3px;padding:0 .35rem;color:var(--muted)}
.drivers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.drivers>div{border:1px solid var(--line);border-radius:5px;padding:.5rem .7rem;background:var(--soft)}
.drivers small{color:var(--muted);display:block}
.expl{margin:.4rem 0 .8rem;padding-left:1.1rem}
.expl li{margin:.25rem 0}
.act{border:2px solid var(--x);background:var(--xt);border-radius:5px;padding:.7rem .9rem}
.act .b{display:flex;gap:.4rem;align-items:center}
.note{font-size:.82rem;color:var(--muted);border-left:3px solid var(--line);padding-left:.6rem;margin-top:.7rem}
.err{display:flex;gap:.7rem;padding:.8rem;border:2px solid var(--orange);background:var(--orange-t);border-radius:5px}

/* meter */
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:relative;margin-top:.8rem}
.meter i{height:12px;display:block}
.meter .mk{position:absolute;top:-8px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink);transform:translateX(-7px)}
.mlabels{display:grid;grid-template-columns:repeat(5,1fr);font-size:.7rem;color:var(--muted);margin-top:2px}
.bigscore{font-family:var(--fd);font-size:4.4rem;font-weight:700;line-height:.9}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem}
.mg>div{border:1px solid var(--line);border-radius:5px;padding:.55rem .7rem}
.mg .k{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:.4rem;align-items:center}
.mg .v{font-family:var(--fd);font-size:1.6rem;font-weight:700;line-height:1.15}

/* countdown + timeline */
.cd{text-align:center;padding:.9rem;border:2px solid var(--x,var(--line));background:var(--xt,var(--soft));border-radius:6px}
.cd .cl{font-weight:700}
.cd .cn{font-family:var(--fd);font-size:3.6rem;font-weight:700;line-height:1.05;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tlist{list-style:none;margin:0;padding:0}
.tlist li{display:grid;grid-template-columns:28px 1fr auto;gap:.6rem;position:relative;padding:.4rem 0}
.tlist li::before{content:"";position:absolute;left:13px;top:1.6rem;bottom:-.5rem;width:2px;background:var(--line)}
.tlist li:last-child::before{display:none}
.tlist .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;background:var(--surface);color:var(--muted);z-index:1}
.tlist .done .mk{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .tlist .done .mk{color:#052}
.tlist .cur .mk{border-color:var(--red);color:var(--red);animation:pl 1.6s infinite}
.tlist .cur{font-weight:700}
.tlist .tm{font-family:var(--fd);font-size:1.1rem;font-weight:600}
.tlist .st{font-size:.78rem;color:var(--muted);display:block;font-weight:500}

/* forms */
label.f{display:block;font-weight:600;margin-bottom:.7rem}
label.f>span{display:block;margin-bottom:.2rem;font-size:.9rem}
input[type=text],input[type=password],input[type=time],input[type=number],select,textarea{width:100%;min-height:42px;padding:.45rem .65rem;border:2px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit}

.help{font-size:.82rem;color:var(--muted);margin-top:.2rem}

.occ{height:14px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.occ i{display:block;background:var(--x,var(--navy3))}
.facs{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.86rem}
.facs span{display:inline-flex;gap:.3rem;align-items:center}
.sh dl{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:0;text-align:center}
.sh dl div{background:var(--soft);border-radius:4px;padding:.3rem}
.sh dt{font-size:.75rem;color:var(--muted)}.sh dd{margin:0;font-family:var(--fd);font-size:1.6rem;font-weight:700;line-height:1.1}

/* progress */
.pr{margin:.5rem 0}
.pr .top2{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem}
.bar{height:12px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:.2rem}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .9s linear}
.msgbox{white-space:pre-wrap;border:2px solid var(--line);background:var(--soft);border-radius:8px;padding:.8rem;font-family:'Noto Sans Tamil',var(--font);font-size:.95rem}
.sos{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0B1F3A;color:#9DF2B6;border-radius:5px;padding:.8rem;white-space:pre-wrap;font-size:.95rem}
.st-ok{color:var(--green)}.st-warn{color:var(--orange)}.st-down{color:var(--red)}
.svc{display:grid;grid-template-columns:24px 1fr auto;gap:.6rem;align-items:center;padding:.65rem .9rem;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}
.svc b{display:block}

/* architecture */
.arch{display:flex;flex-direction:column;align-items:center;gap:0}

.arch .nd small{display:block;font-weight:500;color:var(--muted)}
.arch .ar{height:22px;width:2px;background:var(--navy3);position:relative;margin:0}
.arch .ar::after{content:"";position:absolute;left:-5px;bottom:-1px;border:6px solid transparent;border-top:8px solid var(--navy3);border-bottom:0}
.arch .fan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;width:100%;max-width:640px}
.arch .fan .nd{min-width:0}
pre.code{background:#0B1F3A;color:#D6E4FA;padding:.8rem;border-radius:5px;overflow:auto;font-size:.82rem;margin:0}

.scrim{position:fixed;inset:0;background:rgba(5,12,25,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--surface);color:var(--ink);border-radius:8px;max-width:560px;width:100%;max-height:92vh;overflow:auto;border:2px solid var(--navy3);animation:pop .18s ease-out}

.modal>header{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;background:var(--navy);color:#fff}
.modal>header h2{font-size:1.1rem;flex:1}

.modal footer{display:flex;gap:.5rem;justify-content:flex-end;padding:.8rem 1rem;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:85;border-left:3px solid var(--navy3);display:flex;flex-direction:column;animation:slide .22s ease-out;box-shadow:-8px 0 30px rgba(0,0,0,.25)}

.drawer>header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));background:var(--navy);color:#fff}

.drawer .dbody{overflow:auto;padding:1rem;flex:1}
.drawer footer{padding:.7rem 1rem;padding-bottom:calc(.7rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:.5rem;flex-wrap:wrap}
.pop{position:absolute;right:1rem;top:56px;z-index:60;width:min(360px,calc(100vw - 2rem));background:var(--surface);color:var(--ink);border:2px solid var(--navy3);border-radius:6px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:120;display:flex;flex-direction:column;gap:.4rem;width:min(520px,calc(100vw - 1.5rem));pointer-events:none}
.toast{background:var(--navy);color:#fff;border-left:6px solid var(--yellow);padding:.7rem .9rem;border-radius:5px;font-weight:600;animation:pop .2s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* demo dock */
#dock{position:fixed;left:.7rem;bottom:calc(.7rem + env(safe-area-inset-bottom,0px));z-index:70;background:var(--navy);color:#fff;border:2px solid #fff;border-radius:8px;width:min(340px,calc(100vw - 1.4rem));box-shadow:0 8px 24px rgba(0,0,0,.35)}
#dock header{display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;font-weight:700}
#dock header button{margin-left:auto;background:none;border:0;color:#fff}
#dock .dbody{padding:.2rem .7rem .7rem}
#dock .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#dock .stages button{border:2px solid #fff;background:transparent;color:#fff;border-radius:4px;padding:.35rem .1rem;font-weight:700;font-size:.78rem;min-height:40px}
#dock .stages button[aria-pressed="true"]{background:#fff;color:var(--navy)}
#dock .row2{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
#dock .btn{background:transparent;color:#fff;border-color:#fff;min-height:34px;font-size:.85rem}
#dock .btn.pri{background:#fff;color:var(--navy)}
#dock label{font-size:.8rem;display:flex;gap:.3rem;align-items:center}

/* citizen */
.phonewrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:start}
.phone{width:372px;max-width:100%;height:760px;border:10px solid #0B1F3A;border-radius:36px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}

.route-v{display:flex;flex-direction:column;align-items:stretch;gap:0}

.avoid ul{list-style:none;margin:.3rem 0 0;padding:0}

.loginbox h2{font-family:var(--fd);font-size:2rem;margin-bottom:.2rem}
.loginbox .lang{position:absolute;top:1rem;right:1rem}
.loginbox .lang button{color:var(--ink)}
.loginbox .lang{border-color:var(--line)}
.loginbox .lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sysok{display:inline-flex;gap:.5rem;align-items:center;border:2px solid var(--green);background:var(--green-t);color:var(--green);font-weight:700;padding:.2rem .7rem;border-radius:4px;margin:.8rem 0}

.lfoot{margin-top:2rem;font-size:.85rem;color:var(--muted)}

  #menuBtn{display:inline-flex}
  .top .search{display:none}.prof span{display:none}.clock small{display:none}

  .drivers{grid-template-columns:1fr}
  main{padding:.8rem .7rem 8rem}
}

  .phone{border:0;border-radius:0;height:calc(100vh - 150px);min-height:560px;box-shadow:none}
  .top .pill span.t{display:none}
  .lang button{padding:.3rem .45rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function blob(cx,cy,r,seed,n=12,j=.15){const R=rng(seed),p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r*(1-j+R()*2*j);p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.86])}
  const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],f=v=>v.toFixed(1);let d='M'+m(p[0],p[1]).map(f).join(' ');
  for(let i=1;i<=n;i++){const c=p[i%n],e=m(p[i%n],p[(i+1)%n]);d+=`Q${f(c[0])} ${f(c[1])} ${f(e[0])} ${f(e[1])}`}return d+'Z'}

function factors(w){
  const sat=w.soil_saturation>=70?'High':w.soil_saturation>=40?'Moderate':'Low',ter=w.slope_deg>=25?'Steep':w.slope_deg>=15?'Moderate':'Gentle';
  const con=v=>v>=75?'High':v>=50?'Moderate':'Low';
  return [
   {k:'rain',name:'Rainfall Intensity',ta:'மழைத் தீவிரம்',v:w.rainfall_intensity,ic:'drop',
    rows:[['Current',`${w.rain_mm_hr} mm/hr`],['Forecast',['Steady','Increasing','Increasing','Peaking'][S.stage]],['Contribution',con(w.rainfall_intensity)]],
    ex:w.rainfall_intensity>=60?'Rainfall intensity is significantly increasing predicted runoff.':'Rainfall intensity is low, so predicted runoff is limited.',
    hum:w.rainfall_intensity>=60?'High rainfall intensity is currently increasing flood risk.':w.rainfall_intensity>=40?'Rainfall intensity is rising and adding to flood risk.':'Rainfall intensity is currently low.'},
   {k:'slope',name:'Slope Instability',ta:'சரிவு நிலையின்மை',v:w.slope_instability,ic:'mountain',
    rows:[['Slope',`${w.slope_deg}°`],['Terrain',ter],['Contribution',con(w.slope_instability)]],
    ex:w.slope_deg>=25?'Steep terrain can accelerate surface-water movement.':'Gentler terrain slows surface-water movement.',
    hum:w.slope_deg>=25?'The steep terrain increases rapid surface-water movement.':'The terrain slope adds only moderately to runoff speed.'},
   {k:'soil',name:'Antecedent Soil Saturation',ta:'மண் ஈரப்பதம்',v:w.soil_saturation,ic:'layers',
    rows:[['Saturation',sat],['Rain, past 72 h',`${w.antecedent_mm} mm`],['Contribution',con(w.soil_saturation)]],
    ex:w.soil_saturation>=60?'Highly saturated soil has reduced additional absorption capacity.':'Soil can still absorb additional rainfall.',
    hum:w.soil_saturation>=60?'The soil is already highly saturated, reducing its ability to absorb additional rainfall.':'The soil can still absorb much of the rainfall.'}];
}
const WHYQ={safe:'Why is this area rated safe?',watch:'Why is this area on watch?',warn:'Why is this area at warning level?',high:'Why is this area high risk?',crit:'Why is this area critical?'};
const ACTION={safe:'Continue monitoring. No action required.',watch:'Verify field sensors and brief rescue teams.',warn:'Pre-position boats, keep Shelter A on standby and prepare the Tamil advisory.',high:'Send the evacuation alert to Ward 12 and open the ridge route to Shelter A.',crit:'EVACUATE NOW. Escalate to district control and dispatch rescue team R-07.'};
function fourW(w){
  const l=lvl(w.risk_score),F=factors(w).sort((a,b)=>b.v-a.v);
  const what=`${w.ward} has ${l.key==='safe'?'normal conditions':l.name+' flood risk'}.`;
  const why=`${F.map(f=>f.name.toLowerCase().replace('antecedent ','')).join(' + ')} ${l.key==='safe'||l.key==='watch'?'are within normal limits':'are contributing to the prediction'}.`.replace(/^./,c=>c.toUpperCase());
  const when=w.lead_time_minutes==null?'No flood peak predicted in the next 6 hours.':`Estimated evacuation window: <b>${fHM(w.lead_time_minutes)}</b> · flood peak ${w.peak_time}.`;
  const where=S.stage>=2?`Safe evacuation route → <b>${w.nearest_shelter}</b>${w.id===12?' (2.4 km)':''}.`:`Routes on standby → ${w.nearest_shelter}.`;
  return {what,why,when,where};
}

/* rainfall chart */
function rainChart(){
  const st=S.stage,cur=CUR_RAIN[st],R=rng(7),past=[];
  for(let i=0;i<24;i++)past.push(Math.max(0,+(cur*Math.pow((i+1)/24,2.6)*(.8+R()*.4)).toFixed(1)));
  past[23]=cur;
  const fc=st===0?[cur,cur,cur]:[cur*1.15,cur*1.22,cur*1.05].map(v=>+v.toFixed(1)),all=past.concat(fc),mx=Math.max(80,...all),w=640,h=180,bw=w/all.length;
  let s=`<svg viewBox="0 0 ${w+40} ${h+34}" width="100%" role="img" aria-label="Rainfall intensity: last 24 hours measured and next 3 hours forecast. Now ${cur} millimetres per hour."><g transform="translate(34 6)">`;
  [0,.5,1].forEach(f=>{const y=h-f*h;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="-6" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(f*mx)}</text>`});
  all.forEach((v,i)=>{const bh=v/mx*h,x=i*bw+1,isF=i>=24;s+=`<rect x="${x}" y="${h-bh}" width="${bw-3}" height="${bh}" ${isF?'fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="4 3"':'fill="var(--navy3)"'}><title>${isF?'Forecast +'+(i-23)+' h':(24-i)+' h ago'}: ${v} mm/hr</title></rect>`});
  s+=`<text x="0" y="${h+16}" font-size="11" fill="var(--muted)">−24 h</text><text x="${24*bw}" y="${h+16}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Now</text><text x="${w}" y="${h+16}" text-anchor="end" font-size="11" fill="var(--blue)">+3 h forecast</text><text x="${w}" y="${h+30}" text-anchor="end" font-size="11" fill="var(--muted)">mm/hr</text></g></svg>`;
  return s;
}

   <div style="display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap"><div><div class="small muted">Risk score</div><div class="bigscore num" style="color:var(--x)">${w.risk_score}%</div></div><div>${badge(w.risk_score,{lg:1,noscore:1,solid:1})}<div style="margin-top:.5rem">Road status: <b>${w.road_status}</b></div><div class="tamil small">${S.stage>=2?TA['HIGH FLOOD RISK']:l.ta}</div></div><div style="margin-left:auto">${whyBtn(w.id).replace('min-height:32px','')}</div></div>
   <div class="meter" aria-hidden="true">${LV.map(x=>`<i style="background:${x.col}"></i>`).join('')}<span class="mk" style="left:${w.risk_score}%"></span></div><div class="mlabels" aria-hidden="true">${LV.map(x=>`<span>${x.name.split(' ')[0]}</span>`).join('')}</div></div></section>

  const blocked=isA&&st>=2&&!S.routeAlt,rs=isA?(st<1?'SAFE':st===1?'CAUTION':S.routeAlt?'SAFE':'BLOCKED'):'SAFE';
  const cond=rs==='SAFE'?'safe':rs==='CAUTION'?'warn':'high';

  const warn=isA&&st>=2?`<div class="err lv-high" style="border-color:var(--red);background:var(--red-t);margin-bottom:.8rem" role="alert">${ic('ban',26)}<div><b style="font-size:1.1rem">⚠ ROUTE BLOCKED</b><p>Low-lying culvert predicted unsafe.</p><p class="small tamil">தாழ்வான குழாய்ப்பாலம் பாதுகாப்பற்றது.</p>${S.routeAlt?'':`<div style="margin-top:.5rem">${btn('VIEW SAFE ALTERNATIVE','alt',{cls:'danger',icon:'route'})}</div>`}</div></div>`:isA&&st===1?`<div class="err" style="margin-bottom:.8rem">${ic('tri',22)}<div><b>Caution: culvert water level rising.</b><p class="small">Route stays open for now. Avoid after the next update.</p></div></div>`:'';
  return pageHead(t('Evacuation')+' · '+t('SAFE ROUTE'),'Hydraulic hazard avoidance: elevated ridge roads, not the shortest path',`<div style="display:flex;gap:.3rem;flex-wrap:wrap" role="group" aria-label="Choose shelter">${chips}</div>`)+
  `<div class="grid split"><div>${card('Evacuation map · Ward 12 → '+sh.name,mapView({mode:'evac',you:1})+legend(true),{right:layersBar()})}</div>
  <div style="display:grid;gap:.9rem;align-content:start">${warn}
  <section class="card lv-${cond}" style="border-top:6px solid var(--x)"><header><h2>${t('SAFE ROUTE')} <span class="ta small muted">பாதுகாப்பான பாதை</span></h2></header><div class="body">
  <div class="route-v" aria-label="Route: current location, ridge road, shelter"><div class="st">${ic('pin',20)} Citizen location · Ward 12</div><div class="ln${blocked?' bad':''}"></div><div class="st ${blocked?'':'safe'}">${ic('route',20)} ${blocked?'Direct road via culvert (blocked)':isA?'Elevated safe road':'Elevated road'}</div><div class="ln${blocked?' bad':''}"></div><div class="st ${blocked?'':'safe'}">${ic('mountain',20)} ${isA?'Ridge route':'Ridge connector'}</div><div class="ln"></div><div class="st safe">${ic('home',20)} ${sh.name}</div></div>
  <div class="mg" style="margin-top:.8rem"><div><div class="k">Distance</div><div class="v">${sh.dist} km</div></div><div><div class="k">Travel time</div><div class="v">${sh.min} min</div></div><div><div class="k">Road condition</div><div class="v"><span class="rb lv-${cond}">${ic(cond==='safe'?'check':cond==='warn'?'tri':'ban',14)}${rs}</span></div></div><div><div class="k">Shelter</div><div class="v"><span class="rb lv-${ss.lv}">${ic(ss.ic,14)}${ss.k}</span></div></div></div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem">${btn('Shelter details','shelterPick',{id:sh.id,cls:'sm'})}${btn(t('Send alert'),'goAlert',{id:12,cls:'sm danger',icon:'send',dis:st<1})}</div></div></section>
  ${card('Hazard status',`<ul class="wlist" style="margin:-.9rem">${HAZ.map(h=>{const s=hazState(h);return `<li><span class="nm" style="min-width:0;flex:1">${h.name}</span><span class="rb lv-${s==='blocked'?'high':s==='caution'?'warn':'safe'}">${ic(s==='blocked'?'ban':s==='caution'?'tri':'check',14)}${s.toUpperCase()}</span></li>`}).join('')}<li><span class="nm" style="min-width:0;flex:1">Bridge 2 (elevated)</span><span class="rb lv-safe">${ic('check',14)}OPEN</span></li></ul>`)}
  </div></div>`;

/* ---- Alerts ---- */
function alertMsg(lang,lv){
  const en='⚠ FLOOD ALERT\n\nHeavy rainfall and rising flood risk detected in your area.\n\nPlease move to the nearest safe shelter using the recommended evacuation route.\n\nShelter: Relief Shelter A, 2.4 km.';
  const ta='⚠ வெள்ள எச்சரிக்கை\n\nஉங்கள் பகுதியில் கனமழை மற்றும் வெள்ள அபாயம் அதிகரித்துள்ளது.\n\nபரிந்துரைக்கப்பட்ட வெளியேற்றப் பாதையில் அருகிலுள்ள பாதுகாப்பான நிவாரண முகாமிற்குச் செல்லவும்.\n\nநிவாரண முகாம் A — 2.4 கி.மீ.';
  const pre=lv==='crit'?'🚨 EVACUATE NOW — உடனடியாக வெளியேறவும்\n\n':'';
  return pre+(lang==='ta'?ta:lang==='en'?en:ta+'\n\n'+en);
}
const alertLevel=()=>['NONE','ADVISORY','WARNING','HIGH','CRITICAL'][S.stage+ (S.stage?1:0)] ;
const LEVELN=['—','ADVISORY','HIGH','CRITICAL'];
function alertRecipients(){const A=S.af.ward==='all'?API.allWards().filter(w=>w.risk_score>=70):[API.ward(S.af.ward)];return A.reduce((a,w)=>a+w.pop,0)}
VIEWS.alerts=()=>{

    <div style="margin-top:.7rem">${btn(t('Navigate to safety'),'navstart',{cls:'pri xl',icon:'nav'})}</div>`;
  }else if(S.ctab==='shelter'){
    body=`<h3 style="font-family:var(--fd);font-size:1.5rem;margin-bottom:.5rem">${t('NEAREST SHELTER')}</h3>`+SHELTERS.filter(s=>s.id!=='D').slice(0,3).map(s=>{const ss=shStatus(s),a=s.cap-s.occ[st];return `<div class="card lv-${ss.lv}" style="padding:.7rem;margin-bottom:.5rem;border-left:6px solid var(--x)"><div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap"><b>${s.name}</b><span class="rb">${ic(ss.ic,13)}${ss.k}</span></div><div class="small muted">${s.dist} km · ${a} places free · ${s.med}</div><div style="margin-top:.4rem">${btn('Route here','cRoute',{id:s.id,cls:'sm',icon:'route'})}</div></div>`}).join('');
  }else if(S.ctab==='report'){
    body=`<h3 style="font-family:var(--fd);font-size:1.5rem;margin-bottom:.5rem">${t('Report flood')}</h3><p class="small muted">Tap what you see. Your GPS location is attached.</p><div class="qgrid">${['Rising water','Flooded road','Blocked bridge','Need rescue'].map(x=>btn(x,'cReport',{id:x,icon:'file',is:24})).join('')}</div><p class="help" id="crmsg" role="status">${esc(S.rf.crmsg||'')}</p>`;
  }else{
    body=`<h3 style="font-family:var(--fd);font-size:1.5rem;margin-bottom:.5rem">${t('Send SOS')}</h3><p class="small muted">${S.online?'Sends your location to the control room.':'No internet. Sending as a GSM SMS.'}</p><div style="margin:.8rem 0"><button class="btn danger" data-act="cSos" style="width:100%;min-height:150px;border-radius:50%;max-width:200px;margin:0 auto;display:flex;flex-direction:column;font-size:1.8rem;font-family:var(--fd);font-weight:700">${ic('radio',44)}SOS</button></div><p class="help" id="csosmsg" role="status" style="text-align:center;font-weight:700">${esc(S.rf.csos||'')}</p><div class="sos" style="font-size:.8rem">SOS #LOC:11.42,76.86\n#NEED:RESCUE_1\n#ROAD:${st>=2?'BLOCKED':'OPEN'}</div>`;
  }
  return `<div class="phone" role="region" aria-label="Citizen mobile app preview"><div class="ph-top">${logoSvg().replace('<svg','<svg width="26" height="26"')}<b>NEERKAVAL</b><span style="margin-left:auto" class="small">${ic(S.online?'wifi':'wifioff',16)}</span></div><div class="ph-body">${body}</div>
  <nav class="ph-nav" aria-label="Citizen navigation">${[['home','home','Home'],['route','route','Route'],['shelter','pin','Shelter'],['report','file','Report'],['sos','radio','SOS']].map(n=>`<button data-act="ctab" data-id="${n[0]}"${S.ctab===n[0]?' aria-current="page"':''}>${ic(n[1],22)}${t(n[2])}</button>`).join('')}</nav></div>`;
}
VIEWS.citizen=()=>pageHead(t('Citizen View'),'Simplified mobile-first interface for residents')+`<div class="phonewrap">${citizenPhone()}<div>${card('How citizens see it',`<ol style="padding-left:1.2rem;margin:0;display:grid;gap:.5rem"><li>A push and SMS alert arrives (send one from <b>Alerts</b>).</li><li>The home screen shows one status, one countdown and four big actions.</li><li><b>${t('Start safe route')}</b> shows the safe road and what to avoid.</li><li>With no internet, SOS goes out over GSM.</li></ol><p class="note">Use Demo mode (bottom left) to change the situation and watch this screen update.</p>`)}</div></div>`;
function citizenOnlyView(){return `<div style="max-width:420px;margin:0 auto;padding:.5rem">${citizenPhone()}<p style="text-align:center;margin-top:.6rem">${btn('Back to sign in','logout',{cls:'ghost'})}</p></div>`}

/* =====================================================================
   OVERLAYS
   ===================================================================== */
function overlays(){
  let h='';
  if(S.drawer){const w=API.ward(S.drawer.ward);h+=`<div class="scrim" data-act="closeDrawer" style="justify-content:flex-end;align-items:stretch;padding:0;background:rgba(5,12,25,.45)"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" id="drawer"><header><h2 id="dtitle">${S.lang==='ta'?'ஏன்?':'Why?'} · ${w.ward} · ${w.locality}</h2><button class="iconbtn" data-act="closeDrawer" aria-label="Close explanation">${ic('x',18)}</button></header><div class="dbody">${xaiPanel(w,true)}<h4 style="margin:1rem 0 .4rem">Timing</h4>${w.lead_time_minutes!=null?cdBlock(w):''}</div><footer>${btn('Open safe route','goRoute',{id:w.id,cls:'pri',icon:'route',dis:S.stage<1})}${btn(t('Send alert'),'goAlert',{id:w.id,cls:'danger',icon:'send',dis:S.stage<1})}${btn('Full XAI page','goXai',{id:w.id})}</footer></aside>`}
  const m=S.modal;
  if(m){
    let inner='';
    if(m.type==='confirm'){const chs=['sms','wa','gsm'].filter(k=>S.af.ch[k]).map(k=>({sms:'SMS',wa:'WhatsApp',gsm:'GSM broadcast'}[k]));const nm=S.af.ward==='all'?'All high-risk wards':'Ward '+S.af.ward;
      inner=`<header><h2 id="mt">Confirm alert</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${ic('x',18)}</button></header><div class="body"><p><b>Send to ${nm}</b> — about <b>${alertRecipients().toLocaleString('en-IN')}</b> residents.</p><p class="small muted">Channels: ${chs.join(', ')||'<b class="st-down">none selected</b>'} · Language: ${{ta:'Tamil',en:'English',both:'Tamil + English'}[S.af.lang]}</p>${!S.online?'<p class="small" style="color:var(--orange)"><b>Offline:</b> queued via GSM gateway (SMS / cell broadcast).</p>':''}<div class="msgbox" style="margin-top:.6rem;max-height:200px;overflow:auto">${esc($('#amsg')?.value||alertMsg(S.af.lang,'high'))}</div><p class="small muted" style="margin-top:.6rem">This cannot be undone once sent.</p></div><footer>${btn('Go back','closeModal')}${btn('CONFIRM & SEND','doSend',{cls:'danger',icon:'send',dis:!Object.values(S.af.ch).some(Boolean)})}</footer>`}
    if(m.type==='sched')inner=`<header><h2 id="mt">Schedule alert</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${ic('x',18)}</button></header><div class="body"><label class="f"><span>Send at</span><input type="time" id="stime" value="14:15"></label><p class="small muted">The alert is added to the log as scheduled and can be cancelled before it goes out.</p></div><footer>${btn('Go back','closeModal')}${btn('SCHEDULE','doSched',{cls:'pri',icon:'clock'})}</footer>`;
    if(m.type==='shelter'){const s=SHELTERS.find(x=>x.id===m.id),ss=shStatus(s),occ=s.occ[S.stage];inner=`<header><h2 id="mt">${s.name}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${ic('x',18)}</button></header><div class="body"><p><span class="rb lv-${ss.lv}">${ic(ss.ic,14)}${ss.k}</span> <span class="ta">${s.ta}</span></p><dl class="det" style="display:block;padding:0;border:0"><dl><dt>Site</dt><dd>${s.site}</dd><dt>Distance</dt><dd>${s.dist} km · ${s.min} min</dd><dt>Occupancy</dt><dd>${occ} / ${s.cap} (${s.cap-occ} free)</dd><dt>Water</dt><dd>${s.water}</dd><dt>Food</dt><dd>${s.food}</dd><dt>Medical</dt><dd>${s.med}</dd><dt>Contact</dt><dd>${s.phone} (sample)</dd></dl></dl></div><footer>${btn('Close','closeModal')}${btn('VIEW ROUTE','viewRoute',{id:s.id,cls:'pri',icon:'route'})}</footer>`}
    h+=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" id="modal">${inner}</div></div>`;
  }
  $('#overlay').innerHTML=h;
  const f=$('#drawer .iconbtn')||$('#modal .iconbtn');if(f&&!S._ofocus){f.focus();S._ofocus=1}if(!h)S._ofocus=0;
}
function dock(){
  const d=$('#dock');if(!S.loggedIn&&!S.citizenOnly){d.innerHTML='';d.hidden=true;return}d.hidden=false;
  d.innerHTML=`<header><span>${ic('sliders',18)}</span>Demo mode <span class="small" style="opacity:.85;font-weight:500">· ${STAGES[S.stage].n}</span><button data-act="dockToggle" aria-expanded="${S.dockOpen}" aria-label="Toggle demo panel">${ic('chev',18)}</button></header>
  ${S.dockOpen?`<div class="dbody"><div class="stages" role="group" aria-label="Simulate flood stage">${STAGES.map((s,i)=>`<button data-act="stage" data-id="${i}" aria-pressed="${S.stage===i}">${s.n.replace(' risk','')}</button>`).join('')}</div>
  <div class="row2"><button class="btn ${S.auto?'':'pri'}" data-act="autoplay">${ic(S.auto?'stop':'play',16)}${S.auto?'Stop scenario':'Play full scenario'}</button></div>
  <p class="small" style="margin:.5rem 0 0;opacity:.9">Normal → Warning → High → Critical. Map, scores, XAI, countdown, route and alerts all update.</p></div>`:''}`;
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function focusKey(){const a=document.activeElement;if(!a||a===document.body)return null;if(a.dataset&&a.dataset.act)return `[data-act="${a.dataset.act}"]${a.dataset.id!==undefined?`[data-id="${a.dataset.id}"]`:''}`;if(a.id)return '#'+a.id;return null}
function render(){
  const fk=focusKey(),sy=window.scrollY;
  document.documentElement.classList.toggle('large',S.large);
  document.documentElement.lang=S.lang==='ta'?'ta':'en';
  const app=$('#app');
  if(S.citizenOnly)app.innerHTML=citizenOnlyView();
  else app.innerHTML=S.loggedIn?shell(VIEWS[S.view]()):loginView();
  overlays();dock();
  if(fk&&!S.drawer&&!S.modal){const e=document.querySelector(fk);if(e)e.focus({preventScroll:true})}
  window.scrollTo(0,sy);
  tick(true);
}
function tick(noAdvance){
  if(!noAdvance){if(S.stage>=1&&S.secs>0)S.secs--;S.sim++}
  document.querySelectorAll('[data-cd]').forEach(e=>{const off=+(e.dataset.off||0),s=Math.max(0,S.secs+off*60);e.textContent=e.dataset.f==='hm'?fHM(Math.ceil(s/60)):fHMS(s)});
  document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=fClock(S.sim));
  const a=S.alertSent;if(a){if(!noAdvance)a.age++;const g=(x,d)=>clamp(x/d,0,1),v={del:a.n*g(a.age,8)*.96,read:a.n*g(a.age-3,25)*.74,ack:a.n*g(a.age-6,45)*.41,route:a.n*g(a.age-10,70)*.22};
    document.querySelectorAll('[data-resp]').forEach(e=>e.textContent=Math.round(v[e.dataset.resp]).toLocaleString('en-IN'));
    document.querySelectorAll('[data-respb]').forEach(e=>e.style.width=(v[e.dataset.respb]/a.n*100).toFixed(1)+'%')}
  const s=S.sos;if(s&&!noAdvance){s.age++;const st=s.age<3?'Queued on device':s.age<6?'Sent via GSM gateway':'Acknowledged by control room';if(st!==s.st){s.st=st;const e=$('#sosst');if(e)e.textContent=st}}
}
setInterval(()=>tick(),1000);

function go(v){S.view=v;S.navOpen=false;S.bell=false;S.mz=1;S.mc=[500,310];render();const m=$('#main');if(m){window.scrollTo(0,0);m.focus({preventScroll:true})}}
const ACT={
  nav:e=>go(e.dataset.id),
  menu:()=>{S.navOpen=!S.navOpen;render()},
  bell:()=>{S.bell=!S.bell;render()},
  lang:e=>{S.lang=e.dataset.id;render()},
  net:()=>{S.online=!S.online;toast(S.online?'Back online. Syncing…':'Offline mode active.');render()},
  logout:()=>{S.loggedIn=false;S.citizenOnly=false;S.navOpen=false;render()},
  citizenOnly:()=>{S.citizenOnly=true;render()},
  ward:e=>{S.ward=+e.dataset.id;render()},
  selWard:e=>{S.ward=+e.dataset.id;render()},
  openWard:e=>{if(e.dataset.id)S.ward=+e.dataset.id;go('risk')},
  rsort:e=>{S.rSort=e.dataset.id;render()},
  why:e=>{S.ward=+e.dataset.id;S.drawer={ward:+e.dataset.id};render()},
  closeDrawer:()=>{S.drawer=null;render()},
  closeModal:()=>{S.modal=null;render()},
  scrim:(e,ev)=>{if(ev.target===e){S.modal=null;render()}},
  xo:e=>{S.xo[e.dataset.id]=!S.xo[e.dataset.id];render()},
  goXai:e=>{S.ward=+e.dataset.id;S.drawer=null;go('xai')},
  goRoute:e=>{S.ward=+e.dataset.id;S.drawer=null;S.shelter='A';go('evac')},
  goAlert:e=>{S.af.ward=String(e.dataset.id);S.drawer=null;go('alerts')},
  mapMode:e=>{S.mapMode=e.dataset.id;render()},
  zoom:e=>{const d=+e.dataset.id;if(d===0){S.mz=1;S.mc=[500,310]}else S.mz=clamp(S.mz*(d>0?1.5:1/1.5),1,4);render()},
  zoomWard:()=>{const w=WARDS.find(x=>x.id===S.ward);S.mz=2.4;S.mc=[w.x,w.y];render()},
  shelterSel:e=>{S.shelter=e.dataset.id;render()},
  shelterPick:e=>{S.modal={type:'shelter',id:e.dataset.id};render()},
  viewRoute:e=>{S.shelter=e.dataset.id;S.modal=null;go('evac')},
  alt:()=>{S.routeAlt=true;toast('Safe alternative shown: elevated ridge route to Shelter A.');render()},
  stage:e=>{stopAuto();setStage(+e.dataset.id)},
  autoplay:()=>{if(S.auto){stopAuto();render();return}setStage(0,true);S.auto=setInterval(()=>{if(S.stage>=3){stopAuto();render();return}setStage(S.stage+1)},7000);toast('Scenario started: rainfall is about to increase.');render()},
  dockToggle:()=>{S.dockOpen=!S.dockOpen;dock()},
  confirmAlert:()=>{if(!Object.values(S.af.ch).some(Boolean)){toast('Select at least one channel.');return}S.modal={type:'confirm'};render()},
  schedAlert:()=>{S.modal={type:'sched'};render()},
  cancelAlert:()=>{S.af={ward:String(S.ward),lang:'both',ch:{sms:1,wa:1,gsm:1}};toast('Alert cancelled.');render()},
  doSend:()=>{const chs=['sms','wa','gsm'].filter(k=>S.af.ch[k]).map(k=>({sms:'SMS',wa:'WhatsApp',gsm:'GSM'}[k])),n=alertRecipients(),wn=S.af.ward==='all'?'all high-risk wards':'Ward '+S.af.ward;
    S.alertSent={age:0,n,chs:chs.join(' + '),wardName:wn,ts:fClock(S.sim)};S.alertLog.unshift({t:f12(S.sim/60),ward:wn,lv:S.stage>=3?'CRITICAL':'HIGH',ch:chs.join(', '),n});S.modal=null;toast(`Alert sent to ${n.toLocaleString('en-IN')} residents (${chs.join(' + ')}).`);render()},
  doSched:()=>{const tm=$('#stime').value||'14:15';S.alertLog.unshift({t:tm,ward:S.af.ward==='all'?'All high-risk wards':'Ward '+S.af.ward,lv:'HIGH',ch:'SMS, WhatsApp',n:alertRecipients(),sched:1});S.modal=null;toast('Alert scheduled for '+tm+'.');render()},
  verify:e=>{const r=S.reports.find(x=>x.id==e.dataset.id);if(r){r.v=true;toast('Report verified.')}render()},
  gps:()=>{const out=$('#gpsout');if(S.faults.gps||!navigator.geolocation){S.rf.gps='Location unavailable. Type your location manually.';render();return}
    out.textContent='Locating…';navigator.geolocation.getCurrentPosition(p=>{S.rf.gps=`GPS ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;S.rf.loc=$('#rl')?.value||'';render()},()=>{S.rf.gps='Location unavailable. Type your location manually.';render()},{timeout:6000})},
  dispatch:e=>{const tm=S.teams.find(x=>x.id===e.dataset.id);tm.status='EN ROUTE';tm.ward=S.ward;const w=WARDS.find(x=>x.id===S.ward);tm.x=w.x+30;tm.y=w.y-25;toast(`Team ${tm.id} dispatched to Ward ${S.ward}.`);render()},
  sendSos:()=>{S.rf.sn=$('#sn').value;S.rf.sb=$('#sb').value;S.rf.sr=$('#sr').value;S.sos={t:fClock(S.sim),age:0,st:'Queued on device'};toast('SOS queued via GSM.');render()},
  sync:()=>{if(!S.online){toast('No internet. Sync will start when the connection returns.');return}S.syncing=true;render();setTimeout(()=>{S.syncing=false;S.lastSync=f12(S.sim/60);toast('Offline cache synchronized.');render()},2200)},
  ctab:e=>{S.ctab=e.dataset.id;render()},
  cRoute:e=>{S.shelter=e.dataset.id;S.ctab='route';render()},
  navstart:()=>{S.navStarted=true;render()},
  cReport:e=>{S.reports.unshift({id:Date.now(),type:e.dataset.id,sev:'Medium',loc:'Ward 12 · citizen GPS',desc:'Quick report from citizen app.',ago:0,x:452,y:362,v:false,src:'Citizen (mobile)',min:0,mine:1});S.rf.crmsg='Report sent. Thank you. Officers can see it on the map.';toast('Report submitted.');render()},
  cSos:()=>{S.rf.csos=S.online?'SOS sent with your location.':'No internet. SOS sent by GSM SMS.';toast(S.rf.csos);render()}
};
function stopAuto(){if(S.auto){clearInterval(S.auto);S.auto=null}}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e||e.disabled)return;const f=ACT[e.dataset.act];if(f){if(e.dataset.act==='scrim'&&ev.target!==e)return;f(e,ev)}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.drawer){S.drawer=null;render()}else if(S.bell){S.bell=false;render()}return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('g[data-act]')){ev.preventDefault();ACT[ev.target.dataset.act](ev.target,ev)}
  if(ev.key==='Tab'&&(S.modal||S.drawer)){const c=$(S.modal?'#modal':'#drawer');const els=[...c.querySelectorAll('button:not([disabled]),input,select,textarea,[href]')];if(!els.length)return;const a=els[0],z=els[els.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}}
});
document.addEventListener('change',ev=>{
  const e=ev.target,k=e.dataset&&e.dataset.chg;
  if(e.id==='sq'){const v=e.value,m=v.match(/Ward (\d+)/);const s=SHELTERS.find(x=>x.name===v);if(m){S.ward=+m[1];go('risk')}else if(s){S.shelter=s.id;S.modal={type:'shelter',id:s.id};render()}return}
  if(!k)return;
  if(k==='layer'){S.layers[e.dataset.id]=e.checked?1:0;render()}
  else if(k==='xward'){S.ward=+e.value;render()}
  else if(k==='aw'){S.af.ward=e.value;render()}
  else if(k==='alang'){S.af.lang=e.value;render()}
  else if(k==='ach'){S.af.ch[e.value]=e.checked?1:0;const ta=$('#amsg');render()}
  else if(k==='fault'){S.faults[e.dataset.id]=e.checked;render()}
  else if(k==='netbox'){S.online=!e.checked;toast(S.online?'Back online.':'Offline mode active.');render()}
  else if(k==='large'){S.large=e.checked;render()}
  else if(k==='sosf'){S.rf.sn=$('#sn').value;S.rf.sb=$('#sb').value;S.rf.sr=$('#sr').value;const r=$('#sosraw');if(r)r.textContent=sosString()}
  else if(k==='sosloc'){S.sosLoc=e.value;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='sb'){const r=$('#sosraw');if(r){S.rf.sb=ev.target.value;r.textContent=sosString()}}});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='loginForm'){const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p){$('#lerr').textContent='Enter your username and password.';return}
    S.user=u;S.role=$('#lr').value;S.loggedIn=true;S.view=S.role==='Field Rescue Team'?'rescue':'dashboard';render();toast('Signed in as '+S.role+'.')}
  if(f.id==='repForm'){const loc=$('#rl').value.trim();if(!loc){$('#rlerr').textContent='Enter a location or use GPS.';$('#rl').focus();return}
    const w=WARDS.find(x=>loc.toLowerCase().includes('ward '+x.id)||loc.toLowerCase().includes(x.loc.toLowerCase()))||WARDS[11];
    S.reports.unshift({id:Date.now(),type:$('#rt').value,sev:$('#rs').value,loc,desc:$('#rd').value.trim()||'No description.',ago:0,x:w.x+(Math.random()*40-20),y:w.y+(Math.random()*40-20),v:false,src:'Officer entry',min:0,mine:1});
    S.rf={};toast('Report submitted. It supports the prediction but does not change the risk score.');render()}
});
window.addEventListener('online',()=>{S.online=true;toast('Network restored.');render()});
window.addEventListener('offline',()=>{S.online=false;toast('Offline mode active.');render()});
render();
</script>
</body>
</html>
